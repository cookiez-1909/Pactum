[package]
name = "pactum-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NEAR contract that lists Pactum operators who staked NEAR, and slashes them after a public challenge"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
