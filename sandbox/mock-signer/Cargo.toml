[package]
name = "mock-signer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stand-in for the MPC signer, used only by the local sandbox tests"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[workspace]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
